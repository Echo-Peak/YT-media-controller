name: Create assets
on:
  push:
    branches: ["main", "staging", "develop"]

permissions:
  contents: write

jobs:
  create-tags:
    runs-on: ubuntu-latest
    outputs:
      tag_version: ${{ steps.set_version.outputs.tag_version }}
      channel_alias: ${{ steps.create_channel_alias.outputs.channel_alias }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version/tag variable
        id: set_version
        run: |
          PACKAGE_JSON_VERSION=$(cat ./package.json | awk -F'"' '/"version":/ {print $4; exit}')
          TAG_TYPE="alpha"
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG_TYPE="stable"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            TAG_TYPE="beta"
          fi
          VERSION="v${PACKAGE_JSON_VERSION}-${TAG_TYPE}.${{ github.run_number }}"
          echo "tag_version=$VERSION" >> $GITHUB_OUTPUT
      - name: Configure git author
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Create immutable tag
        run: |
          git tag ${{ steps.set_version.outputs.tag_version }}
          git push origin ${{ steps.set_version.outputs.tag_version }}
        shell: bash
      - name: Create channel alias tag
        if: ${{ github.ref_name == 'develop' || github.ref_name == 'staging' ||
          github.ref_name == 'main' }}
        shell: bash
        id: create_channel_alias
        run: |
          case "${{ github.ref_name }}" in
            develop) CHANNEL_ALIAS="alpha-latest" ;;
            staging) CHANNEL_ALIAS="beta-latest" ;;
            main)    CHANNEL_ALIAS="stable-latest" ;;
          esac
          git tag -fa "$CHANNEL_ALIAS" -m "Update $CHANNEL_ALIAS -> $GITHUB_SHA"
          git push -f origin "$CHANNEL_ALIAS"
          echo "channel_alias=$CHANNEL_ALIAS" >> $GITHUB_OUTPUT

  build-desktop-app:
    runs-on: windows-2022
    needs: create-tags
    steps:
      - uses: actions/checkout@v4
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Fetch external binaries
        run: node ./backend/scripts/installExternalDeps.js

      - name: Setup Node with Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "yarn"

      - name: Install project NPM modules
        run: yarn
        shell: bash

      - name: Install frontend NPM modules
        run: cd frontend && yarn
        shell: bash

      - name: Install frontend cargo modules
        run: cd frontend/src-tauri && cargo fetch
        shell: bash

      - name: Restore NuGet packages
        run: |
          nuget restore ./backend/YTMediaControllerSrv/YTMediaControllerSrv.sln

      - name: Run UI tests
        run: cd frontend && yarn test:ui
        continue-on-error: false

      - name: Build installer
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run package

      - name: Create manifest file
        run: node ./packager/createManifest.js

      - name: Grab last commit message
        run: git log -1 --pretty=%B > RELEASE_BODY.txt

      - name: Upload installer to GitHub Release (immutable tag)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: false
          tag_name: ${{ needs.create-tags.outputs.tag_version }}
          body_path: RELEASE_BODY.txt
          files: |
            ./dist/YoutubeMediaControllerInstaller.exe
            ./dist/manifest.json
      - name: Ensure channel alias release exists
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ needs.create-tags.outputs.channel_alias }}" >/dev/null 2>&1 \
          || gh release create "${{ needs.create-tags.outputs.channel_alias }}" --title "${{ needs.create-tags.outputs.channel_alias }}" --prerelease
      - name: Upload (overwrite) assets to channel alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-tags.outputs.channel_alias }}" \
            "./dist/YoutubeMediaControllerInstaller.exe" \
            "./dist/manifest.json" \
            --clobber

  build-android-app:
    needs: create-tags
    name: Build android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*',
            '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./mobile/android/gradlew

      - name: Build Release APK
        run: |
          cd ./mobile/android
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Upload Release APK to GitHub Release (immutable tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tags.outputs.tag_version }}
          files: ./mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure channel alias release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ needs.create-tags.outputs.channel_alias }}" >/dev/null 2>&1 \
          || gh release create "${{ needs.create-tags.outputs.channel_alias }}" --title "${{ needs.create-tags.outputs.channel_alias }}" --prerelease
      - name: Upload (overwrite) assets to channel alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-tags.outputs.channel_alias }}" \
            "./mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk" \
            --clobber

  cleanup-on-failure:
    needs: [create-tags, build-desktop-app, build-android-app, build-linux-app]
    if: ${{ always() && failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup tag via script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/cleanup-tag.sh
          bash scripts/cleanup-tag.sh '${{ needs.create-tags.outputs.tag_version }}'

  update-channels-manifest:
    needs: [build-desktop-app, build-linux-app, create-tags]
    if: ${{ success() }}
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify GH CLI
        shell: pwsh
        run: gh --version
      - name: Update channels manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: >
          ./scripts/Update-ChannelsManifest.ps1 -Tag '${{
          needs.create-tags.outputs.tag_version }}' -Branch '${{ github.ref_name
          }}' -Repo '${{ github.repository }}' -MetaBranch 'update-metadata'

  build-linux-app:
    needs: create-tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-0 libappindicator3-1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build backend for Linux
        env:
          RUNTIME: linux-x64
        run: |
          pnpm run build-service

      - name: Copy backend binaries to staging
        run: |
          mkdir -p frontend/src-tauri/linux-staging/opt/ytmediacontroller/
          cp backend/YTMediaControllerSrv/YTMediaControllerSrv/bin/Alpha/net9.0/linux-x64/publish/YTMediaControllerSrv frontend/src-tauri/linux-staging/opt/ytmediacontroller/YTMediaControllerSrv
          cp backend/YTMediaControllerSrv/YTMediaControllerUpdaterSrv/bin/Alpha/net9.0/linux-x64/publish/YTMediaControllerUpdaterSrv frontend/src-tauri/linux-staging/opt/ytmediacontroller/YTMediaControllerUpdaterSrv
          cp backend/systemd/ytmediacontroller.service frontend/src-tauri/linux-staging/opt/ytmediacontroller/
          cp backend/systemd/ytmediacontroller-updater.service frontend/src-tauri/linux-staging/opt/ytmediacontroller/
          cp backend/YTMediaControllerSrv/YTMediaControllerSrv/appSettings.json frontend/src-tauri/linux-staging/opt/ytmediacontroller/
          chmod +x frontend/src-tauri/linux-staging/opt/ytmediacontroller/YTMediaControllerSrv
          chmod +x frontend/src-tauri/linux-staging/opt/ytmediacontroller/YTMediaControllerUpdaterSrv

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Fetch cargo dependencies
        run: cd frontend/src-tauri && cargo fetch

      - name: Build DEB
        run: cd frontend && pnpm run tauri build

      - name: Find DEB file
        id: deb
        run: |
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "Found: $DEB_FILE"

      - name: Inject systemd services into DEB
        run: |
          bash scripts/add-deb-services.sh "${{ steps.deb.outputs.deb_file }}"

      - name: Upload DEB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tags.outputs.tag_version }}
          files: ${{ steps.deb.outputs.deb_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to channel alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-tags.outputs.channel_alias }}" \
            "${{ steps.deb.outputs.deb_file }}" \
            --clobber
