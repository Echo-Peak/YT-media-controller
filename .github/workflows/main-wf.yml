name: Create assets
on:
  push:
    branches: ["main", "staging", "develop"]

permissions:
  contents: write

jobs:
  create-tags:
    runs-on: ubuntu-latest
    outputs:
      tag_version: ${{ steps.set_version.outputs.tag_version }}
      channel_alias: ${{ steps.set_version.outputs.channel_alias }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version/tag variable
        id: set_version
        run: |
          PACKAGE_JSON_VERSION=$(cat ./package.json | awk -F'"' '/"version":/ {print $4; exit}')
          TAG_TYPE="alpha"
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG_TYPE="stable"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            TAG_TYPE="beta"
          fi
          VERSION="v${PACKAGE_JSON_VERSION}-${TAG_TYPE}.${{ github.run_number }}"
          echo "tag_version=$VERSION" >> $GITHUB_OUTPUT
      - name: Configure git author
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Create immutable tag
        run: |
          git tag ${{ steps.set_version.outputs.tag_version }}
          git push origin ${{ steps.set_version.outputs.tag_version }}
        shell: bash
      - name: Create channel alias tag
        if:
          ${{ github.ref_name == 'develop' || github.ref_name == 'staging' ||
          github.ref_name == 'main' }}
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            develop) CHANNEL_ALIAS="alpha-latest" ;;
            staging) CHANNEL_ALIAS="beta-latest" ;;
            main)    CHANNEL_ALIAS="stable-latest" ;;
          esac
          echo "channel_alias=$CHANNEL_ALIAS" >> $GITHUB_OUTPUT
          git tag -fa "$CHANNEL_ALIAS" -m "Update $CHANNEL_ALIAS -> $GITHUB_SHA"
          git push -f origin "$CHANNEL_ALIAS"

  build-desktop-app:
    runs-on: windows-2022
    needs: create-tags
    steps:
      - uses: actions/checkout@v4
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Fetch external binaries
        run: node ./backend/scripts/installExternalDeps.js

      - name: Setup Node with Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "yarn"

      - name: Install NPM modules
        run: yarn
        shell: bash

      - name: Restore NuGet packages
        run: |
          nuget restore ./backend/YTMediaControllerSrv/YTMediaControllerSrv.sln

      - name: Run UI tests
        run: yarn test-browser
        continue-on-error: false

      - name: Build installer
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run package

      - name: Create manifest file
        run: node ./packager/createManifest.js

      - name: Grab last commit message
        run: git log -1 --pretty=%B > RELEASE_BODY.txt

      - name: Upload installer to GitHub Release (immutable tag)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: false
          tag_name: ${{ needs.create-tags.outputs.tag_version }}
          body_path: RELEASE_BODY.txt
          files: |
            ./dist/YoutubeMediaControllerInstaller.exe
            ./dist/manifest.json
      - name: Ensure channel alias release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ needs.create-tags.outputs.channel_alias }}" >/dev/null 2>&1 \
                || gh release create "${{ needs.create-tags.outputs.channel_alias }}" \
                    --title "${{ needs.create-tags.outputs.channel_alias }}" \
                    --prerelease
      - name: Upload (overwrite) assets to channel alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-tags.outputs.channel_alias }}" \
            "./dist/YoutubeMediaControllerInstaller.exe" \
            "./dist/manifest.json" \
            --clobber

  build-android-app:
    needs: create-tags
    name: Build android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key:
            gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*',
            '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./mobile/android/gradlew

      - name: Build Release APK
        run: |
          cd ./mobile/android
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Upload Release APK to GitHub Release (immutable tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tags.outputs.tag_version }}
          files: ./mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release APK to GitHub Release (channel alias tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tags.outputs.channel_alias }}
          files: ./mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-on-failure:
    needs: [create-tags, build-desktop-app, build-android-app]
    if: ${{ always() && failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup tag via script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/cleanup-tag.sh
          bash scripts/cleanup-tag.sh '${{ needs.create-tags.outputs.tag_version }}'

  update-channels-manifest:
    needs: [build-desktop-app, create-tags]
    if: ${{ success() }}
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify GH CLI
        shell: pwsh
        run: gh --version
      - name: Update channels manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: >
          ./scripts/Update-ChannelsManifest.ps1 -Tag '${{
          needs.create-tags.outputs.tag_version }}' -Branch '${{ github.ref_name
          }}' -Repo '${{ github.repository }}' -MetaBranch 'update-metadata'
