plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.github.triplet.play' version '3.9.1'
}

def unq = { s -> s?.replaceAll('^\"|\"$','')?.trim() }
def ksPathProv   = providers.environmentVariable("SIGNING_STORE_FILE").map { unq(it) }
def ksPassProv   = providers.environmentVariable("SIGNING_STORE_PASSWORD").map { unq(it) }
def keyAliasProv = providers.environmentVariable("SIGNING_KEY_ALIAS").map { unq(it) }
def keyPassProv  = providers.environmentVariable("SIGNING_KEY_PASSWORD").map { unq(it) }
def hasKeystore  = ksPathProv.isPresent() && ksPassProv.isPresent() && keyAliasProv.isPresent()
def saPathProv = providers.environmentVariable("PLAY_SERVICE_ACCOUNT_JSON").map { unq(it) }

android {
    namespace 'com.youtube.media.controller'
    compileSdk 35

    defaultConfig {
        applicationId "com.ytmediacontroller.app"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(ksPathProv.get())
                storePassword ksPassProv.get()
                keyAlias keyAliasProv.get()
                keyPassword keyPassProv.get()
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                // Let debug builds work without env vars; fail only if someone tries to make a signed release
                println "[gradle] No SIGNING_* env vars found; release will be unsigned. Set SIGNING_STORE_FILE, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD to enable signing."
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Always buildable without signing env vars
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding = true
    }
}

play {
    track.set("internal")
    defaultToAppBundles.set(true)
    if (saPathProv.isPresent()) {
        serviceAccountCredentials.set(file(saPathProv.get()))
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.github.yuriy-budiyev:code-scanner:2.3.2'
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
}