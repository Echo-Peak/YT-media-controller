<!doctype html>
<meta charset="utf-8" />
<title>YTMediaController</title>
<script>
  (async () => {
    const params = new URLSearchParams(location.search);
    const latestUpdateChannel = params.get("latestUpdateChannel");
    if (!latestUpdateChannel) {
      return;
    }

    const channel = (latestUpdateChannel || "alpha").toLowerCase();
    const res = await fetch("./channels.json", { cache: "no-store" });
    const manifest = await res.json();
    const target = manifest?.[channel]?.installerUrl;
    if (typeof target === "string" && /^https:\/\//.test(target)) {
      location.replace(target);
    } else {
      document.body.textContent = "No installerUrl for channel: " + channel;
    }
  })();
</script>
